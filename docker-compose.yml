# Local PostgreSQL for development. Copy .env.example to .env (git-ignored) and set your own password.
services:
  postgres:
    image: postgres:17-alpine
    container_name: bookingsystem-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_system}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
