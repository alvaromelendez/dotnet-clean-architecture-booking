name: Docker

# Pull requests: build both images to prove the Dockerfile works (nothing is pushed).
# Tags vX.Y.Z: build the images and publish them to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>            the API (linux/amd64 and linux/arm64)
#   ghcr.io/<owner>/<repo>-migrator   the EF Core migration bundle (linux/amd64 only: `dotnet ef`
#                                     cannot cross-compile a bundle for another CPU architecture,
#                                     see the bundle stage in the Dockerfile)
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [api, migrator]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    name: Publish ${{ matrix.target }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api
            image: ghcr.io/${{ github.repository }}
            platforms: linux/amd64,linux/arm64
          - target: migrator
            image: ghcr.io/${{ github.repository }}-migrator
            platforms: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The API build stages run on the runner's architecture and cross-compile for arm64,
      # and the runtime stages have no RUN instructions, so QEMU is not needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, 1 and latest (latest only for non-prerelease versions).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
