name: Mutation testing

# Stryker.NET takes minutes per project, so it runs weekly and on demand, never on pull requests.
on:
  schedule:
    # Sundays 04:17 UTC.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: Project to mutate
        type: choice
        options: [all, domain, application]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  stryker:
    name: Stryker.NET
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The break thresholds live in stryker-config.<project>.json; the script fails below them.
      - name: Run mutation testing
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -o pipefail
          scripts/mutation.sh "$TARGET" | tee mutation-output.txt

      - name: Publish mutation score
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Mutation score"
            echo
            echo '```'
            sed -n '/^Mutation score/,$p' mutation-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: StrykerOutput/*/reports/
          if-no-files-found: warn
          retention-days: 30
