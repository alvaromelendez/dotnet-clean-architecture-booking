name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the request, the response (status code and problem details `code`/`traceId`) and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. curl -X POST http://localhost:8080/api/v1/...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK version, Docker version, how you run the API.
